# Alembic configuration for the bizkit workflow store (spec D46).
#
# This file ships inside the wheel next to the migrations it points at, so
# `bizkit store upgrade` works from an installed package with no repo
# checkout. The store URL is never written here — it is injected at runtime
# from BizkitConfig by bizkit.store.schema.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revision ids are sequential and readable: 0001_baseline, 0002_....
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
