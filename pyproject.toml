[project]
name = "bizkit"
version = "0.1.0"
description = "Business configuration toolkit: maker-checker workflows, commenting, and validation for configuration data in database tables"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Geoffrey Koh" }]
requires-python = ">=3.13"
keywords = ["configuration", "maker-checker", "workflow", "database", "validation", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Repository = "https://github.com/geoffkoh/bizkit"

[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
mssql = ["pyodbc>=5.0"]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.2"]
snowflake = ["snowflake-sqlalchemy>=1.6"]
databricks = ["databricks-sqlalchemy>=2.0"]
all = [
    "oracledb>=2.0",
    "pyodbc>=5.0",
    "pymysql>=1.1",
    "psycopg[binary]>=3.2",
    "snowflake-sqlalchemy>=1.6",
    "databricks-sqlalchemy>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
bizkit = "bizkit.cli.main:cli"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a real target database (containerized or live)",
    "db_postgres: PostgreSQL integration tests",
    "db_mysql: MySQL/Percona integration tests",
    "db_mssql: MSSQL integration tests",
    "db_oracle: Oracle integration tests",
    "db_snowflake: Snowflake integration tests (needs BIZKIT_TEST_SNOWFLAKE_URL)",
    "db_databricks: Databricks integration tests (needs BIZKIT_TEST_DATABRICKS_URL)",
    "slow: slow-running tests (e.g. Oracle container startup)",
]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27",
    "ruff>=0.14",
    "mypy>=1.14",
]
